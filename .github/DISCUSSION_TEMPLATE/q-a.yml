title: "[Q] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer Issues for reproducible bugs. Use Discussions for how-to and Trusted Agent Loop wiring.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - loop-init / MCP + Harnis
        - pr-gate / GitHub Action
        - index / impact / look
        - verify / authorize
        - browser-demo / studio
        - other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and what blocked you?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: Already tried
      placeholder: witnis loop-init, docs/trusted-agent-loop.md, …
