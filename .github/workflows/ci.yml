name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test witnis-core
        run: cargo test -p witnis-core
      - name: Build witnis-cli
        run: cargo build -p witnis-cli --release

  python:
    name: Python + public bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,lsp]"
      - name: Pytest
        run: pytest -q
      - name: Public benchmark
        run: |
          mkdir -p .witnis/bench-reports
          python -m witnis bench --suite public \
            --report .witnis/bench-reports/public.html \
            --github-summary
      - name: Ground-truth suite
        run: |
          python -m witnis bench --suite ground-truth \
            --report .witnis/bench-reports/ground-truth.html \
            --github-summary
      - name: Upload bench report pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: witnis-bench-reports
          path: .witnis/bench-reports/
          if-no-files-found: warn
      - name: Engine parity (Python vs Rust when native present)
        run: pytest -q tests/test_engine_parity.py

  pr-gate-dogfood:
    name: PR evidence gate (dogfood)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/pr-gate
        with:
          base-ref: origin/${{ github.base_ref }}
          head-ref: HEAD
          strict: "false"
          comment: "true"
          witnis-source: "."

  pr-gate-smoke:
    name: PR evidence gate (push smoke)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/pr-gate
        with:
          base-ref: HEAD~1
          head-ref: HEAD
          strict: "false"
          comment: "false"
          witnis-source: "."
