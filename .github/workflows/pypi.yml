# Publishes to PyPI when a GitHub Release is published.
# Requires a Trusted Publisher on pypi.org for L00PLeGeNd/Witnis (environment: pypi).
name: PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/witnis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install -U pip build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Wait until PyPI README has mcp-name
        run: |
          set -euo pipefail
          v="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          marker="mcp-name: io.github.L00PLeGeNd/witnis"
          for i in $(seq 1 24); do
            if body="$(curl -fsS "https://pypi.org/pypi/witnis/${v}/json" 2>/dev/null)"; then
              if printf '%s' "$body" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if '$marker' in (d['info'].get('description') or '') else 1)"; then
                echo "PyPI ${v} has ${marker}"
                exit 0
              fi
              echo "PyPI ${v} is up but README lacks ${marker}"
              exit 1
            fi
            echo "waiting for PyPI ${v} ($i)"
            sleep 10
          done
          echo "PyPI ${v} not visible yet"
          exit 1
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" | tar xz mcp-publisher
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
