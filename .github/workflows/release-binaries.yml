# Build cross-platform witnis-core binaries (Rust Core subset).
# Full CLI is not the Core binary: uvx witnis
name: Release binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: witnis-core-x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: witnis-core-x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: witnis-core-aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: witnis-core-x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          cargo build -p witnis-cli --release --target ${{ matrix.target }}
          mkdir -p dist
          BIN="witnis-core"
          EXT=""
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            EXT=".exe"
          fi
          SRC="target/${{ matrix.target }}/release/${BIN}${EXT}"
          DEST="dist/${{ matrix.artifact }}${EXT}"
          cp "$SRC" "$DEST"
          # checksum next to the binary
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$(basename "$DEST")" > "$(basename "$DEST").sha256")
          else
            (cd dist && shasum -a 256 "$(basename "$DEST")" > "$(basename "$DEST").sha256")
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    name: Attach to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p upload
          find artifacts -type f -exec cp {} upload/ \;
          ls -la upload
      - uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
          body: |
            ## Binaries (`witnis-core`)

            Rust **Core** utilities only: `discover` · `scan` · `index` · `search` · `overview`.

            Full product (PR gate, look, MCP, gated verify, Studio):

            ```bash
            uvx witnis
            ```

            See [docs/BINARY.md](https://github.com/L00PLeGeNd/Witnis/blob/master/docs/BINARY.md).
