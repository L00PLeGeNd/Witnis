[workspace]
resolver = "2"
members = [
    "crates/witnis-core",
    "crates/witnis-py",
]
default-members = ["crates/witnis-core"]

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/L00PLeGeNd/Witnis"
authors = ["Witnis contributors"]

[workspace.dependencies]
sha2 = "0.10"
walkdir = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.23", features = ["extension-module"] }
