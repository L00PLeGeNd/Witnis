    <text x="99" y="171" font-size="13" text-anchor="middle">Repository</text>
    <text x="274" y="171" font-size="13" text-anchor="middle">SQLite index</text>
    <text x="478" y="66" font-size="12" text-anchor="middle">search / LSP</text>
    <text x="478" y="144" font-size="12" text-anchor="middle">trace / impact</text>
