<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" role="img" aria-labelledby="title desc">
  <title id="title">Witnis architecture</title>
  <desc id="desc">Repository indexes into SQLite; search, impact, Studio and MCP read the index; impact feeds plan-verify, which is gated before verify.</desc>
