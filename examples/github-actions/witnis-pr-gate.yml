# Copy into a consumer repo as .github/workflows/witnis-pr-gate.yml
# Requires: contents:read, pull-requests:write, checks:write
name: Witnis PR evidence gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      execute_verify:
        description: "Run authorized verify (needs WITNIS_ALLOW_VERIFY secret=1)"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve base ref
        id: refs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
            echo "head=HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
            echo "head=HEAD" >> "$GITHUB_OUTPUT"
          fi

      # Prefer a released action path once tagged; until then pin to this repo.
      - uses: L00PLeGeNd/Witnis/.github/actions/pr-gate@master
        with:
          base-ref: ${{ steps.refs.outputs.base }}
          head-ref: ${{ steps.refs.outputs.head }}
          strict: "false"
          comment: "true"
          witnis-source: "git+https://github.com/L00PLeGeNd/Witnis.git"

      # Optional authorized verify — never default on for PRs
      - name: Optional verify execute
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_verify }}
        env:
          WITNIS_ALLOW_VERIFY: ${{ secrets.WITNIS_ALLOW_VERIFY }}
        run: |
          pip install "git+https://github.com/L00PLeGeNd/Witnis.git"
          witnis index .
          witnis pr-gate --base "${{ steps.refs.outputs.base }}" --head HEAD --execute-verify --format markdown -o pr-gate-verify.md
