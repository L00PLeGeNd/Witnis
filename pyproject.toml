[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "witnis"
version = "1.8.1"
description = "Local-first engineering witness for AI coding agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Witnis contributors" }]
keywords = ["mcp", "code-intelligence", "verification", "evidence", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Intended Audience :: Developers",
  "Environment :: Console",
  "Operating System :: OS Independent",
]
dependencies = [
  "typer>=0.12.0",
  "mcp>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
lsp = ["jedi>=0.19.0"]
rust = ["maturin>=1.7"]
all = ["pytest>=8.0", "jedi>=0.19.0", "maturin>=1.7"]

[tool.maturin]
manifest-path = "crates/witnis-py/Cargo.toml"
module-name = "witnis._native"
python-source = "src"

[project.scripts]
witnis = "witnis.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
witnis = ["studio/template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
