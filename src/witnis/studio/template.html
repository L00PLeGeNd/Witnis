<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Witnis Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #14201c;
      --muted: #5b6b64;
      --line: rgba(20, 32, 28, 0.12);
      --paper: #f3f6f4;
      --panel: rgba(255, 255, 255, 0.72);
      --accent: #0f6e56;
      --warn: #9a5b12;
      --bad: #8f2d2d;
      --ok: #0f6e56;
      --shadow: 0 18px 50px rgba(20, 32, 28, 0.08);
      --ease: cubic-bezier(.22, 1, .36, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Source Sans 3", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 12% -10%, rgba(15, 110, 86, 0.10), transparent 55%),
        radial-gradient(900px 600px at 110% 10%, rgba(20, 32, 28, 0.06), transparent 50%),
        linear-gradient(180deg, #f7faf8 0%, var(--paper) 48%, #eef3f0 100%);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
      animation: grain 18s steps(8) infinite;
    }
    @keyframes grain {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-1.2%, 0.8%); }
      50% { transform: translate(0.9%, -1%); }
      75% { transform: translate(-0.5%, 1.2%); }
    }
    .veil {
      position: fixed;
      inset: auto auto 8% -8%;
      width: 42vw;
      height: 42vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(15, 110, 86, 0.12), transparent 68%);
      filter: blur(8px);
      animation: drift 28s var(--ease) infinite alternate;
      pointer-events: none;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(8%, -6%) scale(1.08); }
    }
    .wrap {
      position: relative;
      max-width: 1080px;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 5rem;
    }
    .brand {
      font-family: Fraunces, Georgia, serif;
      font-weight: 650;
      font-size: clamp(3rem, 8vw, 5.5rem);
      letter-spacing: -0.04em;
      line-height: 0.92;
      margin: 0 0 0.75rem;
      opacity: 0;
      transform: translateY(18px);
      animation: enter 1.1s var(--ease) 0.08s forwards;
    }
    .lede {
      max-width: 34rem;
      color: var(--muted);
      font-size: 1.125rem;
      line-height: 1.55;
      margin: 0 0 2.75rem;
      opacity: 0;
      transform: translateY(14px);
      animation: enter 1.05s var(--ease) 0.22s forwards;
    }
    @keyframes enter {
      to { opacity: 1; transform: translateY(0); }
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.5rem;
      margin-bottom: 2.5rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      color: var(--muted);
      opacity: 0;
      animation: enter 1s var(--ease) 0.36s forwards;
    }
    .meta strong { color: var(--ink); font-weight: 500; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0.55rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      backdrop-filter: blur(8px);
    }
    .dot {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 0 rgba(15, 110, 86, 0.45);
      animation: pulse 2.8s var(--ease) infinite;
    }
    .dot.warn { background: var(--warn); }
    .dot.bad { background: var(--bad); }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(15, 110, 86, 0.0); transform: scale(1); }
      50% { box-shadow: 0 0 0 6px rgba(15, 110, 86, 0.0); transform: scale(1.15); }
    }
    .grid {
      display: grid;
      gap: 1.25rem;
      grid-template-columns: 1.2fr 0.8fr;
    }
    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
    }
    section.panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 2px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 1.25rem 1.35rem 1.4rem;
      opacity: 0;
      transform: translateY(16px);
      animation: enter 0.95s var(--ease) forwards;
    }
    section.panel:nth-child(1) { animation-delay: 0.42s; }
    section.panel:nth-child(2) { animation-delay: 0.54s; }
    section.panel:nth-child(3) { animation-delay: 0.66s; grid-column: 1 / -1; }
    h2 {
      margin: 0 0 0.85rem;
      font-family: Fraunces, Georgia, serif;
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }
    .stat {
      border-top: 1px solid var(--line);
      padding-top: 0.7rem;
    }
    .stat .k {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .stat .v {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 1.55rem;
      font-variant-numeric: tabular-nums;
      margin-top: 0.25rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    th, td {
      text-align: left;
      padding: 0.55rem 0.2rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 600;
    }
    td.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.8rem; }
    .empty { color: var(--muted); font-size: 0.95rem; }
    .wide { grid-column: 1 / -1; }
    pre.block {
      margin: 0;
      padding: 0.85rem 1rem;
      overflow: auto;
      max-height: 280px;
      background: rgba(20, 32, 28, 0.04);
      border-radius: 10px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.78rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .foot {
      margin-top: 2rem;
      color: var(--muted);
      font-size: 0.8rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      opacity: 0;
      animation: enter 1s var(--ease) 0.8s forwards;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .brand, .lede, .meta, section.panel, .foot {
        opacity: 1 !important;
        transform: none !important;
      }
      body::before, .veil { display: none; }
    }
  </style>
</head>
<body>
  <div class="veil" aria-hidden="true"></div>
  <main class="wrap">
    <h1 class="brand">Witnis</h1>
    <p class="lede" id="lede"></p>
    <div class="meta" id="meta"></div>
    <div class="grid">
      <section class="panel">
        <h2 id="h-index">Index</h2>
        <div class="stats" id="stats"></div>
      </section>
      <section class="panel">
        <h2 id="h-health">Health</h2>
        <div id="health"></div>
      </section>
      <section class="panel">
        <h2 id="h-runs">Recent verification</h2>
        <div id="runs"></div>
      </section>
      <section class="panel wide">
        <h2 id="h-graph">Relation graph</h2>
        <div id="graph"></div>
      </section>
      <section class="panel">
        <h2 id="h-evidence">Evidence</h2>
        <div id="evidence"></div>
      </section>
      <section class="panel">
        <h2 id="h-report">Report</h2>
        <div id="report"></div>
      </section>
    </div>
    <p class="foot" id="foot"></p>
  </main>
  <script id="witnis-data" type="application/json">__WITNIS_DATA__</script>
  <script>
    const data = JSON.parse(document.getElementById("witnis-data").textContent);
    const repo = data.repository || {};
    const result = data.result || {};
    const studio = data.studio || {};
    const i18n = studio.i18n || {};
    const overview = result.overview || {};
    const health = result.health || {};
    const runs = result.verification_runs || [];
    const state = result.last_verification_state || "none";
    const issues = health.issues || [];
    const evidence = studio.evidence || [];
    const graph = studio.graph || "";
    const reportMd = studio.report_markdown || "";

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    document.getElementById("lede").textContent = i18n.lede || "";
    document.getElementById("h-index").textContent = i18n.index || "Index";
    document.getElementById("h-health").textContent = i18n.health || "Health";
    document.getElementById("h-runs").textContent = i18n.runs || "Recent verification";
    document.getElementById("h-graph").textContent = i18n.graph || "Relation graph";
    document.getElementById("h-evidence").textContent = i18n.evidence || "Evidence";
    document.getElementById("h-report").textContent = i18n.report || "Report";

    const tone = state === "verified" || issues.length === 0 ? "ok"
      : state === "failed" || issues.length ? (state === "failed" ? "bad" : "warn")
      : "ok";

    document.getElementById("meta").innerHTML = `
      <span class="status-pill"><span class="dot ${tone}"></span> ${esc(i18n.verify || "verify")}: <strong>${esc(state)}</strong></span>
      <span>repo <strong>${esc(repo.name || "—")}</strong></span>
      <span>rev <strong>${esc(repo.revision || "workdir")}</strong></span>
      <span>target <strong>${esc(studio.target || "—")}</strong></span>
      <span>generated <strong>${esc(data.generated_at || "")}</strong></span>
    `;

    document.getElementById("stats").innerHTML = `
      <div class="stat"><div class="k">${esc(i18n.files || "Files")}</div><div class="v">${esc(overview.files ?? "—")}</div></div>
      <div class="stat"><div class="k">${esc(i18n.symbols || "Symbols")}</div><div class="v">${esc(overview.symbols ?? "—")}</div></div>
      <div class="stat"><div class="k">${esc(i18n.snapshots || "Snapshots")}</div><div class="v">${esc((result.snapshots || []).length)}</div></div>
    `;

    document.getElementById("health").innerHTML = issues.length
      ? `<table><thead><tr><th>Code</th><th>Detail</th></tr></thead><tbody>${
          issues.map(i => `<tr><td class="mono">${esc(i.code)}</td><td>${esc(i.detail)}</td></tr>`).join("")
        }</tbody></table>`
      : `<p class="empty">${esc(i18n.health_ok || "")}</p>`;

    document.getElementById("runs").innerHTML = runs.length
      ? `<table><thead><tr><th>State</th><th>Target</th><th>When</th></tr></thead><tbody>${
          runs.map(r => `<tr><td class="mono">${esc(r.state)}</td><td class="mono">${esc(r.target || "—")}</td><td class="mono">${esc(r.captured_at || "")}</td></tr>`).join("")
        }</tbody></table>`
      : `<p class="empty">${esc(i18n.runs_empty || "")}</p>`;

    document.getElementById("graph").innerHTML = graph
      ? `<pre class="block">${esc(graph)}</pre>`
      : `<p class="empty">${esc(i18n.graph_empty || "")}</p>`;

    document.getElementById("evidence").innerHTML = evidence.length
      ? `<table><thead><tr><th>Type</th><th>Status</th><th>Ref</th></tr></thead><tbody>${
          evidence.map(e => `<tr><td class="mono">${esc(e.type)}</td><td class="mono">${esc(e.status)}</td><td class="mono">${esc(e.source_ref || e.symbol || e.path || "")}</td></tr>`).join("")
        }</tbody></table>`
      : `<p class="empty">${esc(i18n.evidence_empty || "")}</p>`;

    document.getElementById("report").innerHTML = reportMd
      ? `<pre class="block">${esc(reportMd.slice(0, 4000))}</pre>`
      : `<p class="empty">${esc(i18n.report_empty || "")}</p>`;

    document.getElementById("foot").textContent =
      `${i18n.foot || "Witnis Studio · local-only"} · ${studio.target ? "target " + studio.target : "no target"}`;
  </script>
</body>
</html>
